spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.application.name=ganlu

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

spring.thymeleaf.enabled=false
spring.freemarker.enabled=false
spring.web.resources.static-locations=classpath:/static/

security.jwt.expiration-seconds=${GANLU_JWT_EXPIRATION_SECONDS:28800}

spring.servlet.multipart.max-file-size=${GANLU_MAX_UPLOAD_FILE_SIZE:200MB}
spring.servlet.multipart.max-request-size=${GANLU_MAX_UPLOAD_REQUEST_SIZE:210MB}
spring.servlet.multipart.file-size-threshold=${GANLU_UPLOAD_MEMORY_THRESHOLD:10MB}
spring.servlet.multipart.location=${GANLU_MULTIPART_TEMP_DIR:${java.io.tmpdir}/ganlu-multipart}

team.public-image.max-bytes=${TEAM_PUBLIC_IMAGE_MAX_BYTES:5242880}
team.public-image.max-pixels=${TEAM_PUBLIC_IMAGE_MAX_PIXELS:20000000}
team.public-image.staging-ttl-hours=${TEAM_PUBLIC_IMAGE_STAGING_TTL_HOURS:24}
team.public-image.cleanup-interval-ms=${TEAM_PUBLIC_IMAGE_CLEANUP_INTERVAL_MS:3600000}
team.public-image.user-temp-quota-mb=${TEAM_PUBLIC_IMAGE_USER_TEMP_QUOTA_MB:50}
team.public-image.max-staged-files-per-user=${TEAM_PUBLIC_IMAGE_MAX_STAGED_FILES:10}
team.public-image.user-permanent-quota-mb=${TEAM_PUBLIC_IMAGE_USER_PERMANENT_QUOTA_MB:500}
team.public-image.max-permanent-files-per-user=${TEAM_PUBLIC_IMAGE_MAX_PERMANENT_FILES:100}
team.public-image.min-free-disk-mb=${TEAM_PUBLIC_IMAGE_MIN_FREE_DISK_MB:1024}

# 团队附件：所有状态（含 ARCHIVED）都占用账号级和服务器级永久额度，purge 成功后才释放。
team.media.owner-max-files=${TEAM_MEDIA_OWNER_MAX_FILES:50}
team.media.owner-max-total-mb=${TEAM_MEDIA_OWNER_MAX_TOTAL_MB:2048}
team.media.global-max-files=${TEAM_MEDIA_GLOBAL_MAX_FILES:2000}
team.media.global-max-total-mb=${TEAM_MEDIA_GLOBAL_MAX_TOTAL_MB:20480}
team.media.upload-min-free-disk-mb=${TEAM_MEDIA_UPLOAD_MIN_FREE_DISK_MB:1024}
team.media.multipart-min-free-disk-mb=${TEAM_MEDIA_MULTIPART_MIN_FREE_DISK_MB:1024}
team.media.archived-retention-days=${TEAM_MEDIA_ARCHIVED_RETENTION_DAYS:30}
team.media.retention-cleanup-interval-ms=${TEAM_MEDIA_RETENTION_CLEANUP_INTERVAL_MS:3600000}
file-deletion.retry-interval-ms=${FILE_DELETION_RETRY_INTERVAL_MS:60000}

material.libreoffice.executable=${LIBREOFFICE_EXECUTABLE:}
material.libreoffice.timeout-seconds=${LIBREOFFICE_TIMEOUT_SECONDS:90}
material.upload.session-ttl-hours=${MATERIAL_UPLOAD_SESSION_TTL_HOURS:24}
material.upload.staging-ttl-hours=${MATERIAL_UPLOAD_STAGING_TTL_HOURS:24}
material.upload.cleanup-interval-ms=${MATERIAL_UPLOAD_CLEANUP_INTERVAL_MS:3600000}
material.upload.user-temp-quota-mb=${MATERIAL_UPLOAD_USER_TEMP_QUOTA_MB:1024}
material.upload.max-active-sessions-per-user=${MATERIAL_UPLOAD_MAX_ACTIVE_SESSIONS:5}

ai.enabled=${AI_ENABLED:false}
ai.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
ai.api-key=${DEEPSEEK_API_KEY:}
ai.model=${DEEPSEEK_MODEL:deepseek-v4-flash}
ai.connect-timeout=${DEEPSEEK_CONNECT_TIMEOUT:10000}
ai.read-timeout=${DEEPSEEK_READ_TIMEOUT:60000}
ai.log-hmac-key=${AI_LOG_HMAC_KEY:}

# Optional one-time bootstrap. Clear these environment variables after the first admin is created.
ganlu.bootstrap-admin.username=${GANLU_BOOTSTRAP_ADMIN_USERNAME:}
ganlu.bootstrap-admin.password=${GANLU_BOOTSTRAP_ADMIN_PASSWORD:}
ganlu.bootstrap-admin.phone=${GANLU_BOOTSTRAP_ADMIN_PHONE:}

logging.level.org.springframework.web.client.RestTemplate=INFO
logging.level.org.springframework.http.converter=INFO
