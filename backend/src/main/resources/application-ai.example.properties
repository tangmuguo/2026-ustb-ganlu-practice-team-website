# ============================================================
# AI 小助手（DeepSeek）配置示例
# ============================================================
# 使用说明：
# 1. 复制此文件为 application-ai.properties 或合入你的 profile 文件
# 2. 将真实 API Key 设置为环境变量 DEEPSEEK_API_KEY
# 3. 不得将真实 Key 写入此文件或提交到版本控制
# 4. 设置 AI_LOG_HMAC_KEY 用于日志中用户 ID 的 HMAC 匿名化
#
# Windows PowerShell 示例：
#   $env:DEEPSEEK_API_KEY="sk-xxxxxxxxxxxxxxxxxxxxxxxx"
#   $env:DEEPSEEK_BASE_URL="https://api.deepseek.com"
#   $env:DEEPSEEK_MODEL="deepseek-v4-flash"
#   $env:AI_LOG_HMAC_KEY="your-random-secret-at-least-32-chars"
# ============================================================

# 是否启用 AI 功能
ai.enabled=${AI_ENABLED:true}

# DeepSeek API 基础地址
ai.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}

# DeepSeek API Key —— 必须通过环境变量 DEEPSEEK_API_KEY 注入
ai.api-key=${DEEPSEEK_API_KEY:}

# 模型名（默认 deepseek-v4-flash）
ai.model=${DEEPSEEK_MODEL:deepseek-v4-flash}

# 连接超时（毫秒）
ai.connect-timeout=10000

# 读取超时（毫秒）
ai.read-timeout=60000

# ============================================================
# 日志匿名化 HMAC 密钥
# ============================================================
# AI_LOG_HMAC_KEY 用于日志中用户 ID 的 HMAC-SHA256 匿名化。
# - 必须通过环境变量注入，不得写入配置文件或提交到版本控制。
# - 缺失时安全降级为 "anon"，不记录可关联标识。
# - 生成方式：openssl rand -hex 32 或任意 32 字符以上随机字符串。
# - 示例（仅作格式参考，请勿使用）：
#   $env:AI_LOG_HMAC_KEY="a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6"

# ============================================================
# 以下为必须的日志安全配置，合并到实际 profile 时请保留
# ============================================================
# 禁止 RestTemplate 和 HTTP 消息转换器在日志中输出完整请求/响应正文
logging.level.org.springframework.web.client.RestTemplate=INFO
logging.level.org.springframework.http.converter=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation=INFO
