server.port=${SERVER_PORT:8080}
server.address=${GANLU_SERVER_ADDRESS:127.0.0.1}

spring.datasource.url=${GANLU_DB_URL}
spring.datasource.username=${GANLU_DB_USERNAME}
spring.datasource.password=${GANLU_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

file.upload-dir=${UPLOAD_DIR:/usr/share/ganlu/uploads}
app.allowed-origins=${GANLU_ALLOWED_ORIGINS}
app.base-url=${GANLU_APP_BASE_URL}

security.jwt.secret=${GANLU_JWT_SECRET}
file.security.scan.enabled=${FILE_SECURITY_SCAN_ENABLED:false}
file.security.scan.endpoint=${FILE_SECURITY_SCAN_ENDPOINT:}
file.security.scan.connect-timeout-ms=${FILE_SECURITY_SCAN_CONNECT_TIMEOUT_MS:1000}
file.security.scan.read-timeout-ms=${FILE_SECURITY_SCAN_READ_TIMEOUT_MS:3000}
file.security.scan.timeout-ms=${FILE_SECURITY_SCAN_TIMEOUT_MS:5000}
