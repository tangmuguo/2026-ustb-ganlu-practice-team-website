# 测试环境使用 H2 内存数据库，MySQL 兼容模式
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:ganlu_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# 启动时自动执行建表脚本和初始化数据脚本
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql
spring.sql.init.data-locations=classpath:data-test.sql
spring.sql.init.encoding=UTF-8

# MyBatis 配置（保持和正式环境一致）
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.vihu.ganlu.entitys

# Jackson 序列化配置（和正式环境保持一致）
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=GMT+8

# ========== 一次性补齐所有文件路径配置，彻底解决启动占位符报错 ==========
file.upload-dir=./target/test-upload
file.chunk-dir=./target/test-chunk
file.materials-dir=./target/test-materials
file.cover-dir=./target/test-cover
file.avatar-dir=./target/test-avatar