spring.datasource.url=jdbc:h2:mem:ganlu_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
mybatis.mapper-locations=classpath:mapper/*.xml
spring.sql.init.mode=never
ganlu.scheduling.enabled=false
file.upload-dir=${java.io.tmpdir}/ganlu-test-uploads
file.chunk-dir=${file.upload-dir}/temp_chunks
file.materials-dir=${file.upload-dir}/materials
file.images-dir=${file.upload-dir}/images
security.jwt.secret=test-token-secret-with-more-than-32-bytes
security.jwt.expiration-seconds=3600
