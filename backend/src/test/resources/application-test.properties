# ========== 测试环境核心：H2 内存数据库，替换原MySQL数据源 ==========
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:ganlu_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# ========== 测试库自动初始化：启动执行建表+基础数据脚本 ==========
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql
spring.sql.init.data-locations=classpath:data-test.sql
spring.sql.init.encoding=UTF-8

# ========== 以下原封不动保留主配置的所有业务项 ==========
spring.application.name=ganlu
mybatis.mapper-locations=mapper/*.xml

spring.thymeleaf.enabled=false
spring.thymeleaf.cache=false
spring.freemarker.enabled=true
spring.freemarker.cache=false
spring.freemarker.suffix=.ftl
spring.freemarker.template-loader-path=/WEB-INF/jsp/
spring.freemarker.request-context-attribute=request

spring.web.resources.static-locations=/WEB-INF/

spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.max-file-size=200MB

security.jwt.expiration-seconds=28800

# ========== 补齐所有业务模块的路径配置（正式环境在dev配置里，测试必须占位） ==========
# 补齐文件上传模块所有配置，解决courseDetailServiceImpl、fileStorageUtil启动报错
file.upload-dir=./target/test-upload
file.chunk-dir=./target/test-chunk
file.materials-dir=./target/test-materials
file.images-dir=./target/test-images
file.cover-dir=./target/test-cover
file.avatar-dir=./target/test-avatar